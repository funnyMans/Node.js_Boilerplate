apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: boilerplate-ingress
  namespace: node-boilerplate
  annotations:
    kubernetes.io/ingress.class: 'nginx'
    nginx.ingress.kubernetes.io/limit-rps: '10'
    nginx.ingress.kubernetes.io/limit-burst: '20'
    nginx.ingress.kubernetes.io/proxy-body-size: '10m'
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80
          - path: /users
            pathType: Prefix
            backend:
              service:
                name: users
                port:
                  number: 3001
