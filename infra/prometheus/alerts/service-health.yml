groups:
  - name: tms-foundation-health
    rules:
      - alert: ApiGatewayDown
        expr: up{job="api-gateway"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'TMS API gateway is unavailable'
          description: 'The API gateway has failed Prometheus scrapes for more than one minute.'

      - alert: UsersServiceDown
        expr: up{job="users-service"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'TMS account-profile service is unavailable'
          description: 'The account-profile service has failed Prometheus scrapes for more than one minute.'

      - alert: AuthServiceDown
        expr: up{job="auth-service"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'TMS authentication service is unavailable'
          description: 'The authentication service has failed Prometheus scrapes for more than one minute.'

      - alert: High5xxRate
        expr: sum by (job) (rate({__name__=~".*_http_requests_total", status_code=~"5.."}[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Elevated TMS foundation 5xx error rate'
          description: 'A retained HTTP service is emitting a sustained 5xx rate above the configured threshold.'
