global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - '/etc/prometheus/alerts/*.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:3000']

  - job_name: 'users-service'
    static_configs:
      - targets: ['users:3001']

  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:3002']

  - job_name: 'orders-service'
    static_configs:
      - targets: ['orders:3003']

  - job_name: 'payments-service'
    static_configs:
      - targets: ['payments:3010']

  - job_name: 'inventory-service'
    static_configs:
      - targets: ['inventory:3011']
