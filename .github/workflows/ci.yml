name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Lint, unit tests, and workspace build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check workflow formatting
        run: pnpm exec prettier --check .github/workflows/ci.yml

      - name: Build workspace
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test:unit

  compose-validation:
    name: Validate Compose configurations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate development Compose configuration
        run: docker compose -f infra/docker-compose.dev.yml config --quiet

      - name: Validate E2E Compose configuration
        run: docker compose -f infra/docker-compose.dev.yml -f infra/docker-compose.e2e.yml config --quiet
