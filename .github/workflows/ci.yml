name: CI

on:
  push:
    branches:
      - main
      - stage
  pull_request:
    branches:
      - main
      - stage
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Lint, unit tests, and workspace build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ******127.0.0.1:5432/app
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check workflow formatting
        run: pnpm exec prettier --check .github/workflows/ci.yml

      - name: Build workspace
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test:unit

  compose-validation:
    name: Validate development Compose configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate development Compose configuration
        run: docker compose -f infra/docker-compose.dev.yml config --quiet

  compose-contracts:
    name: Build and probe retained TMS foundation
    needs:
      - validate-and-build
      - compose-validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      AUTH_ACCESS_TOKEN_SECRET: ci-access-token-secret-change-me-32
      AUTH_REFRESH_TOKEN_SECRET: ci-refresh-token-secret-change-me-32
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build retained service images
        run: docker compose -f infra/docker-compose.dev.yml build users auth-service api-gateway

      - name: Start the retained service stack
        run: docker compose -f infra/docker-compose.dev.yml up -d --no-build --wait --wait-timeout 600 api-gateway

      - name: Probe service health, tracing headers, and metrics
        run: pnpm docker:service-contract

      - name: Collect Compose logs after failure
        if: failure()
        run: docker compose -f infra/docker-compose.dev.yml logs --no-color --tail=200

      - name: Stop integration stack
        if: always()
        run: docker compose -f infra/docker-compose.dev.yml down --remove-orphans
